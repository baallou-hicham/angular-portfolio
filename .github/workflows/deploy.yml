name: Deploy Angular Portfolio

on:
  push:
    branches:
      - gh-pages

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: |
          npm run build -- \
            --configuration production \
            --base-href "https://baallou-hicham.github.io/angular-portfolio/"

      - name: Debug build output
        run: |
          echo "=== Project root ==="
          ls -la

          echo "=== dist ==="
          ls -la dist || true

          echo "=== All generated files ==="
          find dist -maxdepth 4 -type f | head -100 || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Angular build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/angular-portfolio/browser

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
